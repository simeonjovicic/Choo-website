"$schema" = "./node_modules/wrangler/config-schema.json"
name = "choo-website"
pages_build_output_dir = "."
compatibility_date = "2026-05-16"

# Top-level bindings are used for local dev. They point to preview resources so
# local testing cannot accidentally write to production.
[[d1_databases]]
binding = "DB"
database_name = "recipes-preview"
database_id = "d22ccb13-c931-4a78-937f-e80d3f24a599"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "c19f09da340f43279b623cf64d261cf8"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "images-preview"

[vars]
ENVIRONMENT = "preview"
ADMIN_PATH_DEFAULT = "/__admin"
TURNSTILE_SITE_KEY = "0x4AAAAAADQnVQRpgK6XEPdC"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "recipes-preview"
database_id = "d22ccb13-c931-4a78-937f-e80d3f24a599"

[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT"
id = "c19f09da340f43279b623cf64d261cf8"

[[env.preview.r2_buckets]]
binding = "IMAGES"
bucket_name = "images-preview"

[env.preview.vars]
ENVIRONMENT = "preview"
ADMIN_PATH_DEFAULT = "/__admin"
TURNSTILE_SITE_KEY = "0x4AAAAAADQnVQRpgK6XEPdC"

[[env.production.d1_databases]]
binding = "DB"
database_name = "recipes-prod"
database_id = "474dab3e-164a-4dd5-a310-a42045e72e10"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT"
id = "de445b7f6f824e768ab6963dcec7ddf4"

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "images-prod"

[env.production.vars]
ENVIRONMENT = "production"
ADMIN_PATH_DEFAULT = "/__admin"
TURNSTILE_SITE_KEY = "0x4AAAAAADQnVQRpgK6XEPdC"
